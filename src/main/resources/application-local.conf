ktor {
  deployment {
    port = 8080
    shutdownTimeout = 15000
  }
  application {
    modules = [no.nav.tsm.ApplicationKt.module]
  }
}

postgres {
  jdbc = "jdbc:postgresql://localhost:5434/tsm-oppgave"
  schema = "public"
}

app {
    name = "tsm-oppgave"
    jobs {
        oppgaveCreator {
            delay: PT10S
            hungTimeout: PT5M
        }
    }
}