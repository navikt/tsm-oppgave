ktor {
  deployment {
    port = 8080
    shutdownTimeout = 15000
  }
  application {
    modules = [no.nav.tsm.ApplicationKt.module]
  }
}

postgres {
  jdbc = ${DB_JDBC_URL}
  username = ${DB_USERNAME}
  password = ${DB_PASSWORD}
}

auth {
  entra {
    audience = ${AZURE_APP_CLIENT_ID}
    openid {
      issuer: ${AZURE_OPENID_CONFIG_ISSUER}
      jwks: ${AZURE_OPENID_CONFIG_JWKS_URI}
    }
  }
}

external {
    texas {
      tokenEndpoint = ${NAIS_TOKEN_ENDPOINT}
    }
    oppgaveApi {
        url = ${OPPGAVE_API_URL}
        texasTargetCluster = ${OPPGAVE_API_CLUSTER}
     }
}