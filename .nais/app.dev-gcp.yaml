spec:
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 90
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 30m
      memory: 512Mi
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
      allowAllUsers: true
  accessPolicy:
    outbound:
      rules:
        - application: oppgave
          namespace: oppgavehandtering
          cluster: dev-fss
      external:
        - host: oppgave.dev-fss-pub.nais.io
  env:
    - name: OPPGAVE_API_URL
      value: https://oppgave.dev-fss-pub.nais.io
