apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tsm-oppgave
  namespace: tsm
  labels:
    team: tsm

spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        databases:
          - name: tsm-oppgave
            envVarPrefix: DB
  port: 8080
  liveness:
    path: /internal/health/alive
  readiness:
    path: /internal/health/ready
  preStopHook:
    http:
      path: /internal/shutdown
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  accessPolicy:
    inbound:
      rules:
        - application: zara
    outbound:
      rules:
        - application: logging
          namespace: nais-system
