apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tsm-oppgave
  namespace: tsm
  labels:
    team: tsm

spec:
  port: 8080
  liveness:
    path: /internal/health/alive
  readiness:
    path: /internal/health/ready
  preStopHook:
    http:
      path: /internal/shutdown
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
